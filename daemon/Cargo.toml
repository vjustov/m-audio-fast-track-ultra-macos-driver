[package]
name = "ftu-daemon"
version = "0.1.0"
edition = "2021"
description = "Helper daemon for the M-Audio Fast Track Ultra: owns the USB device and streams audio through shared memory."
publish = false

[dependencies]
libc = "0.2"
libusb1-sys = "0.7"

[profile.release]
debug = 1

[build-dependencies]
cc = "1"
